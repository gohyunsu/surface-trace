name: Site checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_site.py
      - name: Check generated site is committed
        run: |
          git diff --exit-code -- docs/
          test -z "$(git ls-files --others --exclude-standard docs/)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Serve generated site
        run: python -m http.server 8766 --bind 127.0.0.1 --directory docs > /tmp/surface-trace-http.log 2>&1 &
      - run: pnpm run smoke
      - run: pnpm run visual
